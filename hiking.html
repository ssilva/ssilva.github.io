<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="author" content="Saulo Silva" />
        <title>Hiking — Saulo Silva</title>
        <link rel="icon" href="favicon.ico" />
        <link rel="stylesheet" href="css/pico.classless.min.css" />
        <style>
            figure {
                margin: 2rem 0;
            }
            figure img {
                width: 100%;
                border-radius: 4px;
            }
            figcaption {
                margin-top: 0.5rem;
                font-size: 0.85rem;
                font-style: italic;
                color: var(--pico-muted-color);
                text-align: center;
            }
        </style>
    </head>
    <body>
        <header>
            <hgroup>
                <h1>Hiking</h1>
                <p>The Camino Português, 2023.</p>
            </hgroup>
        </header>

        <main>
            <figure>
                <img
                    src="camino.webp"
                    alt="A cobblestone path lined with a flowering stone wall on the Camino Português"
                />
                <figcaption>
                    Somewhere between Porto and Santiago, Summer 2023.
                </figcaption>
            </figure>

            <p>
                In the summer of 2023, I hiked from Porto, Portugal to Santiago
                de Compostela, Spain — around 240 km in 11 days, following the
                <a
                    href="https://en.wikipedia.org/wiki/Portuguese_Way"
                    target="_blank"
                    rel="noopener"
                    >Camino Português</a
                >.
            </p>

            <p>
                <a
                    href="https://photos.app.goo.gl/iGjVGu4vaLvzPYmWA"
                    target="_blank"
                    rel="noopener"
                    >View the photo album →</a
                >
            </p>
        </main>

        <footer>
            <p><a href="index.html">← Back</a></p>
        </footer>
        <script
            data-goatcounter="https://ssilva.goatcounter.com/count"
            async
            src="https://gc.zgo.at/count.js"
        ></script>
    </body>
</html>
